<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon UI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left">

            <!-- LOGO -->

            <img src="pokemon.png" class="logo">

            <!-- CONTENT -->

            <div class="content">

                <h4>POKEMON GEN I</h4>

                <h1>Pikachu</h1>

                <p>
                    Pikachu is an Electric-type Pokémon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by
                    yellow fur.
                </p>

                <!-- PAGINATION -->

                <div class="pagination">
                    <span class="line"></span>
                    <span>01 / 08</span>
                </div>

            </div>

            <!-- POKEBALL -->

            <div class="pokeball"></div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="right">

            <!-- MENU -->

            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- DOTS -->

            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

        </div>

        <!-- PIKACHU IMAGE -->

        <img src="pikachu.avif" class="pikachu">

    </div>

</body>
</html>
